<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBankApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="brand-icon" aria-hidden="true">
        <rect x="3" y="9" width="18" height="13" rx="2"/>
        <path d="M3 9l9-6 9 6"/>
        <line x1="9" y1="9" x2="9" y2="22"/>
        <line x1="15" y1="9" x2="15" y2="22"/>
      </svg>
      <span class="brand-name">MyBankApp</span>
    </div>
    <button id="btn-new" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Account
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-label">Accounts</span>
        <span class="sidebar-total" id="total-balance">$0.00</span>
      </div>
      <div id="accounts-list" class="accounts-list"></div>
    </aside>

    <main id="content" class="content">
      <div class="welcome">
        <div class="welcome-graphic">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="9" width="18" height="13" rx="2"/>
            <path d="M3 9l9-6 9 6"/>
            <line x1="9" y1="9" x2="9" y2="22"/>
            <line x1="15" y1="9" x2="15" y2="22"/>
          </svg>
        </div>
        <h2 class="welcome-title">Select an account</h2>
        <p class="welcome-sub">Choose an account from the sidebar to view balance and transactions, or create a new one to get started.</p>
        <button class="btn btn-ghost" onclick="document.getElementById('btn-new').click()">Create your first account</button>
      </div>
    </main>
  </div>

  <div id="modal-bg" class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close" class="modal-close-btn" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js"></script>
</body>
</html>
